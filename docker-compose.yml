services:
  db:
    image: postgres:16-alpine
    container_name: itconnect_db
    environment:
      POSTGRES_USER: itconnect_user
      POSTGRES_PASSWORD: itconnect_password
      POSTGRES_DB: itconnect_db
    ports:
      - "5433:5432"
    volumes:
      - itconnect_db_data:/var/lib/postgresql/data
  
  backend:
    build:
      context: ./backend
    container_name: itconnect-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      - db
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
volumes:
    itconnect_db_data:

