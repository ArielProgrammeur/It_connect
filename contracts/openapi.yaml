openapi: 3.0.3
info:
  title: ItConnect API
  version: "1.0.0"
servers:
  - url: http://localhost:8000
    description: Environnement local
paths:
  /auth/register:
    post:
      summary: Creer un compte utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: Compte Cree avec succes
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        "409":
          description: Conflit, cette addresse mail est deja utilise
  /auth/login:
    post:
      summary: Connexion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Connexion reussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  acces_token:
                    type: string
                  token_type:
                    type: string
        "401":
          description: Email ou mot de passe incorect
  /users/me:
    get:
      summary: Recuperer le profil de l'utilisateur connecte
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil utilisateur
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
        "401":
          description: Non authentifie
  /posts:
    get:
      summary: Lister des posts
      responses:
        "200":
          description: Listes des posts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                      id:
                        type: integer
                      author_id:
                        type: integer
                      content:
                        type: string
                      created_at:
                        type: string
                        format: date-time
    post:
      summary: Creer un post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "201":
          description: Post cree avec succes
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  author_id:
                    type: integer
                  content:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        "401":
          description: Non Authentifie
  /posts/{post_id}/likes:
    post:
      summary: Liker un post
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "201": 
          description: Like enregistre avec succes
        "404":
          description: Post non trouve
        "409":
          description: Deja like par cet utilisateur
    delete:
      summary: Retirer son like
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Like retire avec succes
        "404":
          description: Post non trouve
  /posts/{post_id}/comments:
    get:
      summary: Lister les commentaires 
      parameters:
        - name: post_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Liste des commentaires
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                      id:
                        type: integer
                      post_id:
                        type: integer
                      author_id:
                        type: integer
                      content:
                        type: string
                      created_at:
                        type: string
                        format: date-time
    post:
      summary: Ajouter un commentaire
      security:
        - bearerAuth: []
      parameters:
        - name: post_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
      responses:
        "201":
          description: Commentaire cree avec succes
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  post_id:
                    type: integer
                  author_id:
                    type: integer
                  content:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        "401":
          description: Non Authentifie 
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

