openapi: 3.0.3
info:
  title: ItConnect API
  version: "1.0.0"
servers:
  - url: http://localhost:8000
    description: Environnement local
paths:
  /auth/register:
    post:
      summary: Creer un compte utilisateur
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "201":
          description: Compte Cree avec succes
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        "409":
          description: Conflit, cette adresse mail est deja utilise
  /auth/login:
    post:
      summary: Connexion
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [email, password]
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
      responses:
        "200":
          description: Connexion reussie
          content:
            application/json:
              schema:
                type: object
                properties:
                  access_token:
                    type: string
                  token_type:
                    type: string
        "401":
          description: Email ou mot de passe incorect
  /users/me:
    get:
      summary: Recuperer le profil de l'utilisateur connecte
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Profil utilisateur
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  email:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        "401":
          description: Non authentifie
  /posts:
    get:
      summary: Lister des posts
      responses:
        "200":
          description: Listes des posts
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                      id:
                        type: integer
                      author_id:
                        type: integer
                      title:
                        type: string
                        minLength: 1
                        maxLength: 255
                      content:
                        type: string
                        minLength: 1
                        maxLength: 1000
                      created_at:
                        type: string
                        format: date-time
    post:
      summary: Creer un post
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [title, content]
              properties:
                title:
                  type: string
                  minLength: 1
                  maxLength: 255
                content:
                  type: string
                  minLength: 1
                  maxLength: 1000
      responses:
        "201":
          description: Post cree avec succes
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  author_id:
                    type: integer
                  title:
                    type: string
                    minLength: 1
                    maxLength: 255
                  content:
                    type: string
                    minLength: 1
                    maxLength: 1000
                  created_at:
                    type: string
                    format: date-time
        "401":
          description: Non Authentifie
  /posts/{post_id}:
    parameters: 
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
    delete:
      summary: Supprimer un post (Auteur Uniquement)
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Post Supprime avec ses commentaires et ses likes
        "401":
          description: Non authentifie
        "403":
          description: Non autorise (Vous n'etes pas l'auteur du post)
        "404":
          description: Post Introuvable
    get:
      summary: Recuperer un post par son ID
      responses:
        "200":
          description: Post trouve
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  author_id:
                    type: integer
                  title:
                    type: string
                    minLength: 1
                    maxLength: 255
                  content:
                    type: string
                    minLength: 1
                    maxLength: 1000
                  created_at:
                    type: string
                    format: date-time
        "404":
          description: Post Introuvable
  /posts/{post_id}/likes:
    parameters: 
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
    post:
      summary: Liker un post
      security:
        - bearerAuth: []
      responses:
        "201": 
          description: Like enregistre avec succes
        "404":
          description: Post Introuvable
        "401":
          description: Non Authentifie
        "409":
          description: Deja like par cet utilisateur
    delete:
      summary: Retirer son like
      security:
        - bearerAuth: []
      responses:
        "204":
          description: Like retire avec succes
        "401":
          description: Non Authentifie
        "404":
          description: Post non trouve
  /posts/{post_id}/comments:
    parameters: 
      - name: post_id
        in: path
        required: true
        schema:
          type: integer
    get:
      summary: Lister les commentaires 
      responses:
        "200":
          description: Liste des commentaires
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                      id:
                        type: integer
                      post_id:
                        type: integer
                      author_id:
                        type: integer
                      content:
                        type: string
                      created_at:
                        type: string
                        format: date-time
        "404":
          description: Post Introuvable
    post:
      summary: Ajouter un commentaire
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [content]
              properties:
                content:
                  type: string
                  minLength: 1
                  maxLength: 500
      responses:
        "201":
          description: Commentaire cree avec succes
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                  post_id:
                    type: integer
                  author_id:
                    type: integer
                  content:
                    type: string
                  created_at:
                    type: string
                    format: date-time
        "401":
          description: Non Authentifie 
        "404":
          description: Post Introuvable
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

